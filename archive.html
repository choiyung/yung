<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>YUNG — Archive</title>
<style>
:root{--bg:#fff;--fg:#050505;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff;color:#050505}body{font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none}button,a,input{color:inherit;font:inherit}button{appearance:none;border:0;padding:0;background:none;cursor:pointer}a{text-decoration:none}

.archive-bar{position:fixed;top:106px;left:50%;transform:translateX(-50%);z-index:90;color:#fff;mix-blend-mode:difference}.view-switch{display:flex;gap:20px}.view-switch button{width:40px;height:44px;display:grid;place-items:center;opacity:.36}.view-switch button[aria-pressed=true],.view-switch button:hover{opacity:1}.view-switch svg{width:24px;height:24px}
.stage{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#fff}.viewport{position:absolute;inset:0;width:100%;height:100dvh;overflow:hidden;cursor:grab;touch-action:pan-y}.viewport.is-dragging{cursor:grabbing}.rail{position:absolute;left:0;top:0;width:auto;height:100dvh;display:flex;align-items:flex-end;gap:0;padding:0;will-change:transform}.card{position:relative;flex:0 0 auto;width:var(--layout-w,48vw);height:var(--layout-h,auto);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:transparent}.card-media{display:block;width:100%;height:100%;object-fit:var(--media-fit,contain);object-position:var(--media-pos,center);pointer-events:none}.card.is-bleed{background:#111}.card.is-bleed .card-media{object-fit:cover}
#indexPanel{position:fixed;inset:171px 0 0;z-index:80;background:#fff;overflow:auto;padding:20px 30px 40px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-gutter:stable}.index-row{display:grid;grid-template-columns:72px 124px minmax(0,1fr) 145px 95px;align-items:center;gap:20px;border-top:1px solid #ddd;width:100%;text-align:left;padding:17px 0;min-height:102px;font-size:11px}.index-row:hover{background:#f6f6f4}.index-row img{width:60px;height:68px;object-fit:cover}.index-row strong{font-size:22px;line-height:1.2;font-weight:400;letter-spacing:-.035em;display:block}.index-row small{display:block;font-size:11px;line-height:1.5;color:#777;margin-top:8px;max-width:520px}.index-row .date,.index-row .project,.index-row .kind{color:#555}.index-legend{min-height:24px;font-size:9px;color:#888;padding:8px 0;text-transform:uppercase;letter-spacing:.04em}

@media(max-width:800px){#main-header{padding:16px 14px}#mainLogo{font-size:26px}.archive-bar{top:84px}.menu-links{left:14px}.menu-links a{font-size:clamp(48px,16vw,82px)}#indexPanel{inset:150px 0 0;padding:0 14px 26px}.index-row{grid-template-columns:54px minmax(0,1fr);grid-template-rows:auto auto;column-gap:14px;row-gap:7px;padding:18px 0;min-height:120px}.index-row img{width:54px;height:70px;grid-column:1;grid-row:1/3}.index-row .date{grid-column:2;grid-row:1;font-size:10px}.index-row .entry-copy{grid-column:2;grid-row:2}.index-row strong{font-size:19px}.index-row .project,.index-row .kind{display:none}.index-legend{display:none}}
